<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Koinonia - Nova Acomodação</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#2c0050",
                        "on-surface-variant": "#cec2d3",
                        "inverse-surface": "#e9e0ea",
                        "on-primary-container": "#f0dbff",
                        "tertiary-container": "#512800",
                        "error-container": "#93000a",
                        "surface-tint": "#deb7ff",
                        "primary-container": "#4d0085",
                        "surface-container-lowest": "#120a18",
                        "surface-variant": "#2d1345",
                        "on-error-container": "#ffdad6",
                        "surface-bright": "#2d1345",
                        "tertiary-fixed-dim": "#fcb883",
                        "secondary-container": "#563f6c",
                        "on-error": "#690005",
                        "on-secondary-container": "#caade1",
                        "surface-container-highest": "#3a1d56",
                        "error": "#ffb4ab",
                        "inverse-primary": "#deb7ff",
                        "tertiary": "#ffbf00",
                        "outline": "#978d9d",
                        "primary": "#4d0085",
                        "surface-container": "#24162e",
                        "on-secondary-fixed-variant": "#5a4400",
                        "secondary-fixed-dim": "#ffbf00",
                        "surface-container-low": "#1b0f23",
                        "on-tertiary-container": "#cb8e5c",
                        "surface": "#1b0f23",
                        "on-surface": "#f1eef4",
                        "background": "#1b0f23",
                        "secondary": "#ffbf00",
                        "on-tertiary": "#1b0f23",
                        "on-background": "#f1eef4",
                        "on-tertiary-fixed-variant": "#693b11",
                        "surface-container-high": "#2d1345",
                        "secondary-fixed": "#ffefc1",
                        "primary-fixed": "#f0dbff",
                        "surface-dim": "#160d1d",
                        "on-primary-fixed-variant": "#63249a",
                        "primary-fixed-dim": "#deb7ff",
                        "inverse-on-surface": "#342f37",
                        "on-tertiary-fixed": "#2f1500",
                        "on-secondary": "#1b0f23",
                        "outline-variant": "#4c4451",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1b0f23;
        }
        .glass-panel {
            background: rgba(45, 19, 69, 0.4);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(77, 0, 133, 0.2);
        }
        input:focus, textarea:focus {
            outline: none;
            box-shadow: 0 0 0 2px #ffbf00;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-background min-h-screen pb-32">
<!-- Ambient Light Effects -->
<div class="fixed top-0 left-0 w-96 h-96 bg-primary/20 blur-[120px] rounded-full pointer-events-none -translate-x-1/2 -translate-y-1/2"></div>
<div class="fixed bottom-0 right-0 w-96 h-96 bg-secondary/10 blur-[120px] rounded-full pointer-events-none translate-x-1/2 translate-y-1/2"></div>
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#1b0f23]/80 backdrop-blur-xl dark:bg-[#1b0f23]/80 shadow-2xl">
<div class="flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform text-[#ffbf00]">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-['Inter'] font-bold tracking-tight text-xl text-[#ffbf00]">Nova Acomodação</h1>
</div>
<div class="w-10 h-10 rounded-full border-2 border-[#4d0085] overflow-hidden">
<img alt="Profile picture" class="w-full h-full object-cover" data-alt="Close-up professional portrait of a man in dark environment with cinematic warm side lighting on his face" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAHaQQ6nkBgV2TxaR4v2JIQQb8zlnkCYHEH5EC0_2agLx8fgUQE4LiZ1Kkvti1fr-dCHorx80qmiuIa79OPUTJKoF23hZ5Fu0NIP99DLY8Jod32muG6AXnheYAawkZNzHwmhdjvMORQJOvc2BZBCiy4X18aagFKkaOaYAEKGW2ZXf2NrtIejzHfV18OYFtmSQZv0GT_ziZmbVhV_EJf4pq582ckGlYmCwU5nwcRKf7safg-2dVMEVWxatJ7zwKdUWTQd2UHMb-aVbI"/>
</div>
</div>
<div class="bg-gradient-to-r from-transparent via-[#4d0085]/30 to-transparent h-[1px]"></div>
</header>
<!-- Main Content -->
<main class="pt-24 px-6 max-w-lg mx-auto">
<div class="mb-8">
<h2 class="text-2xl font-bold text-on-surface">Cadastro de Quarto</h2>
<p class="text-slate-400 text-sm mt-1">Insira os detalhes técnicos da nova acomodação do retiro.</p>
</div>
<form class="space-y-6">
<!-- Room Name -->
<div class="space-y-2">
<label class="text-xs font-bold uppercase tracking-widest text-[#ffbf00]">Nome do Quarto</label>
<input class="w-full bg-[#2d1345]/30 border border-[#4d0085]/40 rounded-xl px-4 py-3 text-on-surface placeholder:text-slate-500 transition-all focus:border-[#ffbf00]" placeholder="Ex: Quarto 05" type="text"/>
</div>
<!-- Wing / Gender Selection -->
<div class="space-y-3">
<label class="text-xs font-bold uppercase tracking-widest text-[#ffbf00]">Ala / Gênero</label>
<div class="grid grid-cols-3 gap-3">
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only" name="gender" type="radio"/>
<div class="flex flex-col items-center justify-center p-3 rounded-xl border border-[#4d0085]/40 bg-[#2d1345]/30 peer-checked:bg-[#ffbf00] peer-checked:text-[#1b0f23] transition-all">
<span class="material-symbols-outlined mb-1" data-icon="male">male</span>
<span class="text-xs font-bold">Masculino</span>
</div>
</label>
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="gender" type="radio"/>
<div class="flex flex-col items-center justify-center p-3 rounded-xl border border-[#4d0085]/40 bg-[#2d1345]/30 peer-checked:bg-[#ffbf00] peer-checked:text-[#1b0f23] transition-all">
<span class="material-symbols-outlined mb-1" data-icon="female">female</span>
<span class="text-xs font-bold">Feminino</span>
</div>
</label>
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="gender" type="radio"/>
<div class="flex flex-col items-center justify-center p-3 rounded-xl border border-[#4d0085]/40 bg-[#2d1345]/30 peer-checked:bg-[#ffbf00] peer-checked:text-[#1b0f23] transition-all">
<span class="material-symbols-outlined mb-1" data-icon="wc">wc</span>
<span class="text-xs font-bold">Misto</span>
</div>
</label>
</div>
</div>
<!-- Capacity and Location Row -->
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="text-xs font-bold uppercase tracking-widest text-[#ffbf00]">Capacidade</label>
<div class="flex items-center bg-[#2d1345]/30 border border-[#4d0085]/40 rounded-xl">
<button class="px-3 py-3 text-[#ffbf00] active:scale-90 transition-transform" type="button">
<span class="material-symbols-outlined">remove</span>
</button>
<input class="w-full bg-transparent border-none text-center focus:ring-0 text-on-surface font-bold" type="number" value="4"/>
<button class="px-3 py-3 text-[#ffbf00] active:scale-90 transition-transform" type="button">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<div class="space-y-2">
<label class="text-xs font-bold uppercase tracking-widest text-[#ffbf00]">Bloco</label>
<input class="w-full bg-[#2d1345]/30 border border-[#4d0085]/40 rounded-xl px-4 py-3 text-on-surface placeholder:text-slate-500 transition-all focus:border-[#ffbf00]" placeholder="Ex: Bloco A" type="text"/>
</div>
</div>
<!-- Observations -->
<div class="space-y-2">
<label class="text-xs font-bold uppercase tracking-widest text-[#ffbf00]">Observações</label>
<textarea class="w-full bg-[#2d1345]/30 border border-[#4d0085]/40 rounded-xl px-4 py-3 text-on-surface placeholder:text-slate-500 transition-all focus:border-[#ffbf00] resize-none" placeholder="Ex: Próximo ao banheiro, cama extra, vista para o jardim..." rows="4"></textarea>
</div>
<!-- Submit Button -->
<div class="pt-4">
<button class="w-full bg-[#ffbf00] text-[#1b0f23] py-4 rounded-xl font-black text-lg flex items-center justify-center gap-2 shadow-lg shadow-[#ffbf00]/20 active:scale-95 transition-all" type="submit">
<span class="material-symbols-outlined" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                    Salvar Acomodação
                </button>
</div>
</form>
<!-- Decorative Info Card (Asymmetric Bento Style) -->
<div class="mt-12 glass-panel p-6 rounded-2xl relative overflow-hidden">
<div class="relative z-10">
<h4 class="text-[#ffbf00] font-bold text-sm mb-2 uppercase tracking-wide">Dica do Sistema</h4>
<p class="text-slate-300 text-sm leading-relaxed italic">"Organize as acomodações por proximidade para otimizar o fluxo de pessoas durante os momentos de oração."</p>
</div>
<div class="absolute -right-4 -bottom-4 opacity-10">
<span class="material-symbols-outlined text-8xl" data-icon="bed">bed</span>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center pt-3 pb-6 px-4 bg-[#1b0f23]/90 backdrop-blur-2xl dark:bg-[#1b0f23]/90 z-50 rounded-t-3xl border-t border-[#4d0085]/20 shadow-[0_-10px_40px_rgba(77,0,133,0.3)]">
<a class="flex flex-col items-center justify-center text-slate-400 opacity-70 hover:bg-[#2d1345] transition-all rounded-xl px-3 py-1 active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-['Inter'] text-[12px] font-medium tracking-wide uppercase mt-1">Início</span>
</a>
<a class="flex flex-col items-center justify-center text-[#ffbf00] bg-[#2d1345]/50 rounded-xl px-3 py-1 active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="bed" style="font-variation-settings: 'FILL' 1;">bed</span>
<span class="font-['Inter'] text-[12px] font-medium tracking-wide uppercase mt-1">Quartos</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 opacity-70 hover:bg-[#2d1345] transition-all rounded-xl px-3 py-1 active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="event_available">event_available</span>
<span class="font-['Inter'] text-[12px] font-medium tracking-wide uppercase mt-1">Retiros</span>
</a>
<a class="flex flex-col items-center justify-center text-slate-400 opacity-70 hover:bg-[#2d1345] transition-all rounded-xl px-3 py-1 active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-['Inter'] text-[12px] font-medium tracking-wide uppercase mt-1">Ajustes</span>
</a>
</nav>
</body></html>
