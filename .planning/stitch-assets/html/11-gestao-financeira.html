<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4d0085",
                        "accent": "#FFBF00",
                        "background-light": "#f7f5f8",
                        "background-dark": "#1b0f23",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .bg-gradient-spirit {
            background: radial-gradient(circle at top left, #4d0085 0%, #1b0f23 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center bg-gradient-spirit p-6 overflow-hidden">
<!-- Background Decoration -->
<div class="absolute top-[-10%] left-[-10%] w-72 h-72 bg-primary/20 rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-96 h-96 bg-accent/10 rounded-full blur-[150px]"></div>
<!-- Login Container -->
<div class="z-10 w-full max-w-[440px] flex flex-col items-center">
<!-- Logo & Header -->
<div class="flex flex-col items-center mb-10">
<div class="flex items-center justify-center w-20 h-20 rounded-full bg-white/5 border border-white/10 backdrop-blur-md mb-6">
<span class="material-symbols-outlined text-accent text-5xl">diversity_1</span>
</div>
<h1 class="text-slate-100 text-4xl font-bold tracking-tight mb-2">Koinonia</h1>
<p class="text-slate-400 text-base font-medium text-center">Gestão com excelência para o seu retiro</p>
</div>
<!-- Form Card -->
<div class="w-full bg-white/5 backdrop-blur-xl border border-white/10 p-8 rounded-xl shadow-2xl">
<form action="#" class="space-y-6">
<!-- Email Input -->
<div class="flex flex-col gap-2">
<label class="text-slate-300 text-sm font-semibold ml-1">E-mail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl">mail</span>
<input class="w-full h-14 pl-12 pr-4 bg-background-dark/50 border border-primary/30 rounded-lg text-slate-100 placeholder:text-slate-600 focus:border-accent focus:ring-1 focus:ring-accent transition-all outline-none" placeholder="exemplo@igreja.com" type="email"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center ml-1">
<label class="text-slate-300 text-sm font-semibold">Senha</label>
<a class="text-accent text-xs font-medium hover:underline" href="#">Esqueceu a senha?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-xl">lock</span>
<input class="w-full h-14 pl-12 pr-12 bg-background-dark/50 border border-primary/30 rounded-lg text-slate-100 placeholder:text-slate-600 focus:border-accent focus:ring-1 focus:ring-accent transition-all outline-none" placeholder="Sua senha segura" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition-colors" type="button">
<span class="material-symbols-outlined text-xl">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-14 bg-accent hover:bg-amber-500 text-primary font-bold text-lg rounded-lg transition-all transform active:scale-[0.98] shadow-lg shadow-accent/20 mt-4" type="submit">
                    Entrar na Comunhão
                </button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-white/10"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-transparent px-2 text-slate-500">Ou acesse com</span>
</div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center h-12 rounded-lg bg-white/5 border border-white/10 hover:bg-white/10 transition-colors">
<div class="w-5 h-5 mr-2 bg-slate-100 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-primary">group</span>
</div>
<span class="text-slate-300 text-sm font-medium">Google</span>
</button>
<button class="flex items-center justify-center h-12 rounded-lg bg-white/5 border border-white/10 hover:bg-white/10 transition-colors">
<div class="w-5 h-5 mr-2 bg-slate-100 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-[16px] text-primary">church</span>
</div>
<span class="text-slate-300 text-sm font-medium">Igreja ID</span>
</button>
</div>
</div>
<!-- Footer Links -->
<p class="mt-8 text-slate-500 text-sm">
            Ainda não tem uma conta? 
            <a class="text-accent font-semibold hover:underline" href="#">Solicite acesso</a>
</p>
</div>
<!-- Floating Component (App Preview/Illustration) -->
<div class="hidden lg:block absolute right-[-50px] top-1/2 -translate-y-1/2 opacity-20 rotate-12 select-none pointer-events-none">
<div class="w-[500px] h-[700px] bg-primary/40 rounded-3xl border border-white/20 p-6 flex flex-col gap-4">
<div class="w-full h-40 bg-white/5 rounded-xl border border-white/5"></div>
<div class="w-3/4 h-8 bg-white/10 rounded-full"></div>
<div class="w-full h-4 bg-white/5 rounded-full"></div>
<div class="w-full h-4 bg-white/5 rounded-full"></div>
<div class="w-2/3 h-4 bg-white/5 rounded-full"></div>
<div class="mt-auto grid grid-cols-3 gap-2">
<div class="aspect-square bg-accent/20 rounded-lg"></div>
<div class="aspect-square bg-accent/20 rounded-lg"></div>
<div class="aspect-square bg-accent/20 rounded-lg"></div>
</div>
</div>
</div>
</div>
</body></html>
