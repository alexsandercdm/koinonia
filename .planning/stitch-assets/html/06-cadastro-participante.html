<!DOCTYPE html>

<html class="dark" lang="pt-br"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4d0085",
                        "accent": "#f59e0b",
                        "background-light": "#f7f5f8",
                        "background-dark": "#1b0f23",
                        "card-dark": "#291736",
                        "border-dark": "#522e6b",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen">
<div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto">
<!-- TopAppBar Navigation -->
<div class="flex items-center bg-background-light dark:bg-background-dark p-4 pb-2 justify-between sticky top-0 z-10">
<div class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-start">
<span class="material-symbols-outlined cursor-pointer">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-12">Inscrição Koinonia</h2>
</div>
<!-- Progress Indicator -->
<div class="flex flex-col gap-3 p-4">
<div class="flex gap-6 justify-between">
<p class="text-slate-900 dark:text-slate-100 text-base font-medium leading-normal">Dados do Participante</p>
<p class="text-slate-600 dark:text-slate-400 text-sm font-normal leading-normal">Etapa 1 de 3</p>
</div>
<div class="rounded-full bg-primary/20 h-2 w-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500" style="width: 33%;"></div>
</div>
</div>
<main class="flex flex-col pb-24">
<!-- Section 1: Dados Pessoais -->
<div class="px-4 py-5">
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-primary">person</span>
<h2 class="text-xl font-bold leading-tight">Dados Pessoais</h2>
</div>
<div class="space-y-4">
<label class="flex flex-col gap-2">
<span class="text-sm font-medium text-slate-700 dark:text-slate-300">Nome Completo</span>
<input class="form-input block w-full rounded-lg border-slate-200 dark:border-border-dark bg-white dark:bg-card-dark text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-primary h-12 px-4" placeholder="Como no seu RG" type="text"/>
</label>
<label class="flex flex-col gap-2">
<span class="text-sm font-medium text-slate-700 dark:text-slate-300">Data de Nascimento</span>
<div class="relative">
<input class="form-input block w-full rounded-lg border-slate-200 dark:border-border-dark bg-white dark:bg-card-dark text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-primary h-12 px-4" placeholder="DD/MM/AAAA" type="text"/>
<span class="material-symbols-outlined absolute right-3 top-3 text-slate-400">calendar_month</span>
</div>
</label>
<div class="flex flex-col gap-2">
<span class="text-sm font-medium text-slate-700 dark:text-slate-300">Gênero (Para Acomodação)</span>
<div class="grid grid-cols-2 gap-3">
<button class="flex items-center justify-center gap-2 h-12 rounded-lg border-2 border-primary bg-primary/10 text-primary font-semibold">
<span class="material-symbols-outlined">male</span> Masculino
                            </button>
<button class="flex items-center justify-center gap-2 h-12 rounded-lg border border-slate-200 dark:border-border-dark bg-white dark:bg-card-dark text-slate-600 dark:text-slate-400 font-medium">
<span class="material-symbols-outlined">female</span> Feminino
                            </button>
</div>
</div>
</div>
</div>
<!-- Divider -->
<div class="h-2 bg-slate-100 dark:bg-primary/10 my-2"></div>
<!-- Section 2: Contato de Emergência -->
<div class="px-4 py-5">
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-primary">emergency</span>
<h2 class="text-xl font-bold leading-tight">Contato de Emergência</h2>
</div>
<div class="space-y-4">
<label class="flex flex-col gap-2">
<span class="text-sm font-medium text-slate-700 dark:text-slate-300">Nome do Contato</span>
<input class="form-input block w-full rounded-lg border-slate-200 dark:border-border-dark bg-white dark:bg-card-dark text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-primary h-12 px-4" placeholder="Nome de um familiar ou amigo" type="text"/>
</label>
<label class="flex flex-col gap-2">
<span class="text-sm font-medium text-slate-700 dark:text-slate-300">Telefone</span>
<div class="relative">
<input class="form-input block w-full rounded-lg border-slate-200 dark:border-border-dark bg-white dark:bg-card-dark text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-primary h-12 px-4" placeholder="(00) 00000-0000" type="tel"/>
<span class="material-symbols-outlined absolute right-3 top-3 text-slate-400">call</span>
</div>
</label>
</div>
</div>
<!-- Divider -->
<div class="h-2 bg-slate-100 dark:bg-primary/10 my-2"></div>
<!-- Section 3: Ficha de Saúde -->
<div class="px-4 py-5">
<div class="flex items-center gap-2 mb-4">
<span class="material-symbols-outlined text-primary">medical_services</span>
<h2 class="text-xl font-bold leading-tight">Ficha de Saúde</h2>
</div>
<div class="space-y-6">
<div class="space-y-3">
<div class="flex items-center justify-between">
<span class="text-sm font-medium text-slate-700 dark:text-slate-300">Possui Alergias?</span>
<input class="w-6 h-6 rounded border-slate-300 dark:border-border-dark text-primary focus:ring-primary bg-white dark:bg-card-dark" type="checkbox"/>
</div>
<textarea class="form-textarea block w-full rounded-lg border-slate-200 dark:border-border-dark bg-white dark:bg-card-dark text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-primary min-h-[80px] p-3 text-sm" placeholder="Liste suas alergias (medicamentos, poeira, etc)"></textarea>
</div>
<div class="space-y-3">
<div class="flex items-center justify-between">
<span class="text-sm font-medium text-slate-700 dark:text-slate-300">Restrições Alimentares?</span>
<input class="w-6 h-6 rounded border-slate-300 dark:border-border-dark text-primary focus:ring-primary bg-white dark:bg-card-dark" type="checkbox"/>
</div>
<textarea class="form-textarea block w-full rounded-lg border-slate-200 dark:border-border-dark bg-white dark:bg-card-dark text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-primary min-h-[80px] p-3 text-sm" placeholder="Vegetariano, intolerante a lactose, glúten, etc"></textarea>
</div>
<div class="space-y-3">
<div class="flex items-center justify-between">
<span class="text-sm font-medium text-slate-700 dark:text-slate-300">Medicamentos Contínuos?</span>
<input class="w-6 h-6 rounded border-slate-300 dark:border-border-dark text-primary focus:ring-primary bg-white dark:bg-card-dark" type="checkbox"/>
</div>
<textarea class="form-textarea block w-full rounded-lg border-slate-200 dark:border-border-dark bg-white dark:bg-card-dark text-slate-900 dark:text-slate-100 focus:border-primary focus:ring-primary min-h-[80px] p-3 text-sm" placeholder="Quais medicamentos e horários?"></textarea>
</div>
</div>
</div>
</main>
<!-- Bottom Action Bar -->
<div class="fixed bottom-0 left-0 right-0 p-4 bg-white/80 dark:bg-background-dark/80 backdrop-blur-md border-t border-slate-200 dark:border-border-dark max-w-md mx-auto">
<button class="w-full bg-accent hover:bg-accent/90 text-slate-900 font-bold text-lg py-4 rounded-xl flex items-center justify-center gap-2 shadow-lg active:scale-95 transition-transform">
<span>Salvar e Continuar</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</body></html>
