<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Koinonia — Design System v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body { font-family: 'DM Sans', sans-serif; background: #F7F4EF; color: #1A1612; -webkit-font-smoothing: antialiased; }
  button { cursor: pointer; font-family: inherit; border: none; background: none; }
  input, select, textarea { font-family: inherit; }
  .ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20; }
  .ms-fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20; }
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #CFC8BB; border-radius: 99px; }
  @keyframes spin  { from { transform: rotate(0deg);   } to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
</style>
</head>
<body>
<div id="root"></div>

<!-- Component files (order matters: primitives → layout → data → pages) -->
<script type="text/babel" src="koinonia-primitives.jsx"></script>
<script type="text/babel" src="koinonia-layout.jsx"></script>
<script type="text/babel" src="koinonia-data.jsx"></script>
<script type="text/babel" src="koinonia-page-login.jsx"></script>
<script type="text/babel" src="koinonia-pages-main.jsx"></script>
<script type="text/babel" src="koinonia-page-acomodacoes.jsx"></script>
<script type="text/babel" src="koinonia-page-eventos.jsx"></script>

<!-- App root -->
<script type="text/babel">
const PAGE_META = {
  dashboard:     { title: 'Dashboard'             },
  participantes: { title: 'Participantes'          },
  eventos:       { title: 'Eventos'               },
  inscricoes:    { title: 'Inscrições'            },
  acomodacoes:   { title: 'Acomodações'           },
  financeiro:    { title: 'Financeiro'            },
};

function App() {
  const [loggedIn,       setLoggedIn]       = React.useState(false);
  const [selectedEvent,  setSelectedEvent]  = React.useState(null);
  const [page,           setPage]           = React.useState('dashboard');

  /* ── 1. Login ── */
  if (!loggedIn) return <LoginPage onLogin={() => setLoggedIn(true)} />;

  /* ── 2. Event selector ── */
  if (!selectedEvent) {
    return (
      <EventSelectorScreen
        userName="Admin"
        onSelect={(ev) => setSelectedEvent(ev)}
      />
    );
  }

  /* ── 3. Main app ── */
  const PAGE_ACTIONS = {
    participantes: () => <Btn variant="primary" icon="person_add">Novo participante</Btn>,
    eventos:       () => null,
    inscricoes:    () => <Btn variant="primary" icon="person_add">Nova inscrição</Btn>,
    acomodacoes:   () => <Btn variant="secondary" icon="picture_as_pdf">Exportar PDF</Btn>,
    financeiro:    () => <Btn variant="secondary" icon="download">Exportar relatório</Btn>,
    dashboard:     () => <Btn variant="primary" icon="add" onClick={() => setPage('eventos')}>Novo evento</Btn>,
  };

  const renderPage = () => {
    switch (page) {
      case 'dashboard':     return <DashboardPage setPage={setPage} />;
      case 'participantes': return <ParticipantesPage />;
      case 'eventos':       return <EventosPage />;
      case 'inscricoes':    return <InscricoesPage />;
      case 'acomodacoes':   return <AcomodacoesPage />;
      case 'financeiro':    return <FinanceiroPage />;
      default:              return <DashboardPage setPage={setPage} />;
    }
  };

  const meta    = PAGE_META[page] || { title: '' };
  const actions = PAGE_ACTIONS[page] ? PAGE_ACTIONS[page]() : null;

  return (
    <AppShell
      page={page}
      setPage={setPage}
      title={meta.title}
      actions={actions}
      selectedEvent={selectedEvent}
      onSwitchEvent={(ev) => setSelectedEvent(ev)}
    >
      {renderPage()}
    </AppShell>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
