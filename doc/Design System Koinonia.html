<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Koinonia — Design System</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: 'DM Sans', sans-serif; background: #F7F4EF; color: #1A1612; -webkit-font-smoothing: antialiased; }
button { cursor: pointer; font-family: inherit; border: none; background: none; }
input, select, textarea { font-family: inherit; }
.ms { font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal; font-size: 20px; line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 20; }
.ms-fill { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 20; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #CFC8BB; border-radius: 99px; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

/* ── TOKENS ─────────────────────────────────────────────────── */
const C = {
  bg:           '#F7F4EF',
  surface:      '#FFFFFF',
  surfaceRaised:'#FDFCFA',
  border:       '#E8E3D9',
  borderStrong: '#CFC8BB',
  text:         '#1A1612',
  textSec:      '#7A7060',
  textTer:      '#B0A898',
  gold:         '#C4923A',
  goldLight:    '#F5ECD9',
  goldMuted:    '#EDD8AD',
  success:      '#3D7A52',
  successLight: '#E8F4ED',
  warning:      '#B07030',
  warningLight: '#FBF0E2',
  danger:       '#9B3A2E',
  dangerLight:  '#FBECEC',
  info:         '#2E628B',
  infoLight:    '#E8F2FA',
};

/* ── PRIMITIVES ─────────────────────────────────────────────── */
function Icon({ name, size = 20, fill = false, style = {} }) {
  return <span className={'ms' + (fill ? ' ms-fill' : '')} style={{ fontSize: size, ...style }}>{name}</span>;
}

function Badge({ children, color = 'gold' }) {
  const maps = {
    gold:    { bg: C.goldLight,    text: C.gold    },
    success: { bg: C.successLight, text: C.success },
    warning: { bg: C.warningLight, text: C.warning },
    danger:  { bg: C.dangerLight,  text: C.danger  },
    info:    { bg: C.infoLight,    text: C.info    },
    neutral: { bg: '#F0EDE8',      text: C.textSec },
  };
  const s = maps[color] || maps.neutral;
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', padding: '2px 8px',
      borderRadius: 99, fontSize: 11, fontWeight: 500, letterSpacing: '0.02em',
      background: s.bg, color: s.text,
    }}>{children}</span>
  );
}

function Btn({ children, variant = 'primary', size = 'md', onClick, style = {}, disabled = false, icon }) {
  const sizes = { sm: { padding: '6px 12px', fontSize: 13 }, md: { padding: '8px 16px', fontSize: 14 }, lg: { padding: '11px 22px', fontSize: 15 } };
  const variants = {
    primary:   { bg: C.text,        color: '#fff',    border: 'none',                  hoverBg: '#2E2820' },
    secondary: { bg: 'transparent', color: C.text,    border: `1px solid ${C.border}`, hoverBg: C.surfaceRaised },
    gold:      { bg: C.gold,        color: '#fff',    border: 'none',                  hoverBg: '#A87B2F' },
    ghost:     { bg: 'transparent', color: C.textSec, border: 'none',                  hoverBg: '#F0EDE8' },
    danger:    { bg: C.dangerLight, color: C.danger,  border: `1px solid #F0CACA`,     hoverBg: '#F5DADA' },
  };
  const v = variants[variant]; const s = sizes[size];
  const [hov, setHov] = React.useState(false);
  return (
    <button onClick={onClick} disabled={disabled}
      onMouseEnter={() => setHov(true)} onMouseLeave={() => setHov(false)}
      style={{
        display: 'inline-flex', alignItems: 'center', gap: 6,
        borderRadius: 7, fontWeight: 500, lineHeight: 1,
        background: disabled ? '#E8E3D9' : (hov ? v.hoverBg : v.bg),
        color: disabled ? C.textTer : v.color, border: v.border || 'none',
        cursor: disabled ? 'not-allowed' : 'pointer', transition: 'all 0.12s ease',
        ...s, ...style,
      }}
    >
      {icon && <Icon name={icon} size={15} />}
      {children}
    </button>
  );
}

function Input({ value, onChange, placeholder, type = 'text', icon, style = {} }) {
  const [focus, setFocus] = React.useState(false);
  return (
    <div style={{ position: 'relative' }}>
      {icon && <span style={{ position: 'absolute', left: 11, top: '50%', transform: 'translateY(-50%)', color: focus ? C.gold : C.textTer, transition: 'color 0.15s', pointerEvents: 'none' }}><Icon name={icon} size={17} /></span>}
      <input type={type} value={value} onChange={onChange} placeholder={placeholder}
        onFocus={() => setFocus(true)} onBlur={() => setFocus(false)}
        style={{
          width: '100%', height: 38, padding: icon ? '0 12px 0 36px' : '0 12px',
          border: `1px solid ${focus ? C.goldMuted : C.border}`,
          borderRadius: 7, fontSize: 14, background: C.surface, color: C.text,
          outline: 'none', transition: 'border 0.15s, box-shadow 0.15s',
          boxShadow: focus ? `0 0 0 3px ${C.goldLight}` : 'none', ...style,
        }}
      />
    </div>
  );
}

function Card({ children, style = {}, padding = 20, onClick }) {
  const [hov, setHov] = React.useState(false);
  return (
    <div onClick={onClick}
      onMouseEnter={() => onClick && setHov(true)}
      onMouseLeave={() => onClick && setHov(false)}
      style={{
        background: C.surface, border: `1px solid ${hov ? C.borderStrong : C.border}`,
        borderRadius: 10, padding,
        transition: 'border 0.15s, box-shadow 0.15s',
        boxShadow: hov ? '0 2px 12px rgba(0,0,0,0.07)' : '0 1px 3px rgba(0,0,0,0.04)',
        cursor: onClick ? 'pointer' : 'default', ...style,
      }}
    >{children}</div>
  );
}

function FilterTabs({ options, value, onChange }) {
  return (
    <div style={{ display: 'flex', gap: 4, padding: '3px', background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8 }}>
      {options.map(o => (
        <button key={o.key} onClick={() => onChange(o.key)}
          style={{
            padding: '5px 12px', borderRadius: 6, fontSize: 12.5,
            fontWeight: value === o.key ? 600 : 400,
            background: value === o.key ? C.text : 'transparent',
            color: value === o.key ? '#fff' : C.textSec,
            border: 'none', cursor: 'pointer', transition: 'all 0.12s',
          }}>{o.label}</button>
      ))}
    </div>
  );
}

/* ── NAV ITEMS ──────────────────────────────────────────────── */
const NAV_SECTIONS = [
  { id: 'foundation',      label: 'Foundation' },
  { id: 'typography',      label: 'Typography' },
  { id: 'color',           label: 'Color' },
  { id: 'spacing',         label: 'Spacing & Shape' },
  { id: 'components',      label: 'Components' },
  { id: 'layout',          label: 'Layout' },
  { id: 'patterns',        label: 'Patterns' },
  { id: 'implementation',  label: 'Implementation' },
];

/* ── SECTION HEADER ─────────────────────────────────────────── */
function SectionH({ id, title, sub }) {
  return (
    <div id={id} style={{ paddingTop: 64, paddingBottom: 32, borderBottom: `1px solid ${C.border}`, marginBottom: 40 }}>
      <p style={{ fontSize: 11, fontWeight: 600, color: C.gold, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 8 }}>
        {title}
      </p>
      {sub && <p style={{ fontSize: 14, color: C.textSec, maxWidth: 560 }}>{sub}</p>}
    </div>
  );
}

function Label({ children }) {
  return <p style={{ fontSize: 11, fontWeight: 600, color: C.textTer, letterSpacing: '0.07em', textTransform: 'uppercase', marginBottom: 12 }}>{children}</p>;
}

function Spec({ label, value }) {
  return (
    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '7px 0', borderBottom: `1px solid ${C.border}` }}>
      <span style={{ fontSize: 12, color: C.textSec }}>{label}</span>
      <code style={{ fontSize: 12, background: '#F0EDE8', padding: '2px 7px', borderRadius: 4, color: C.text, fontFamily: 'monospace' }}>{value}</code>
    </div>
  );
}

/* ── SWATCH ─────────────────────────────────────────────────── */
function Swatch({ hex, name, token, size = 'md' }) {
  const [copied, setCopied] = React.useState(false);
  const copy = () => { navigator.clipboard.writeText(hex); setCopied(true); setTimeout(() => setCopied(false), 1200); };
  const h = size === 'lg' ? 72 : size === 'sm' ? 36 : 52;
  const border = hex === '#FFFFFF' || hex === '#FDFCFA' ? `1px solid ${C.border}` : 'none';
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
      <div onClick={copy} style={{
        height: h, borderRadius: 8, background: hex, border, cursor: 'pointer',
        display: 'flex', alignItems: 'center', justifyContent: 'center',
        transition: 'transform 0.1s',
      }}
        onMouseEnter={e => e.currentTarget.style.transform = 'scale(0.97)'}
        onMouseLeave={e => e.currentTarget.style.transform = 'scale(1)'}
      >
        {copied && <span style={{ fontSize: 11, fontWeight: 600, color: hex === C.text ? '#fff' : C.text, background: 'rgba(255,255,255,0.7)', padding: '2px 8px', borderRadius: 99 }}>Copiado!</span>}
      </div>
      <div>
        <div style={{ fontSize: 13, fontWeight: 500, color: C.text }}>{name}</div>
        <div style={{ fontSize: 11, color: C.textTer, fontFamily: 'monospace' }}>{hex}</div>
        {token && <div style={{ fontSize: 10, color: C.textTer, marginTop: 1 }}>C.{token}</div>}
      </div>
    </div>
  );
}

/* ── ICON ROW ───────────────────────────────────────────────── */
function IconRow({ icons }) {
  return (
    <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
      {icons.map(name => (
        <div key={name} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 6, padding: '12px 16px', background: C.surface, border: `1px solid ${C.border}`, borderRadius: 8, minWidth: 72 }}>
          <Icon name={name} size={20} />
          <span style={{ fontSize: 10, color: C.textTer, textAlign: 'center', fontFamily: 'monospace', maxWidth: 70, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{name}</span>
        </div>
      ))}
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════
   SECTIONS
══════════════════════════════════════════════════════════════ */

/* ── FOUNDATION ─────────────────────────────────────────────── */
function FoundationSection() {
  return (
    <section>
      <SectionH id="foundation" title="Foundation"
        sub="Koinonia é um sistema de gestão de retiros para igrejas e ministérios. O design é quente, sério e acolhedor — usando tons terrosos e dourados sobre superfícies creme." />
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 16 }}>
        {[
          { title: 'Propósito', icon: 'diversity_3', body: 'Gestão administrativa de retiros: inscrições, acomodações, participantes e financeiro.' },
          { title: 'Tom', icon: 'auto_awesome', body: 'Sério, cálido, confiável. Sem excessos decorativos. A interface some — a missão fica.' },
          { title: 'Princípio', icon: 'filter_center_focus', body: 'Clareza sobre riqueza visual. Cada elemento justifica sua presença.' },
        ].map(f => (
          <Card key={f.title}>
            <div style={{ width: 36, height: 36, borderRadius: 8, background: C.goldLight, display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 14 }}>
              <Icon name={f.icon} size={18} style={{ color: C.gold }} />
            </div>
            <div style={{ fontSize: 14, fontWeight: 600, color: C.text, marginBottom: 6 }}>{f.title}</div>
            <div style={{ fontSize: 13, color: C.textSec, lineHeight: 1.65 }}>{f.body}</div>
          </Card>
        ))}
      </div>
    </section>
  );
}

/* ── TYPOGRAPHY ─────────────────────────────────────────────── */
function TypographySection() {
  const scale = [
    { name: 'Display',     size: 40, weight: 300, lh: '1.15', ls: '-0.03em', use: 'Hero / Login headline' },
    { name: 'Heading 1',   size: 22, weight: 600, lh: '1.3',  ls: '-0.02em', use: 'Event banner title' },
    { name: 'Heading 2',   size: 16, weight: 600, lh: '1.4',  ls: '-0.01em', use: 'Drawer titles, section headers' },
    { name: 'Heading 3',   size: 14, weight: 600, lh: '1.4',  ls: '0',       use: 'Card titles, table section headers' },
    { name: 'Body',        size: 14, weight: 400, lh: '1.6',  ls: '0',       use: 'Parágrafo padrão' },
    { name: 'Body Medium', size: 14, weight: 500, lh: '1.5',  ls: '0',       use: 'Nomes em tabelas, labels de input' },
    { name: 'Small',       size: 13, weight: 400, lh: '1.6',  ls: '0',       use: 'Texto secundário, metadados' },
    { name: 'Caption',     size: 12, weight: 400, lh: '1.5',  ls: '0',       use: 'Datas, roles, detalhes auxiliares' },
    { name: 'Label',       size: 11, weight: 600, lh: '1.2',  ls: '0.08em',  use: 'Section titles, table headers (uppercase)' },
  ];
  return (
    <section>
      <SectionH id="typography" title="Typography"
        sub="DM Sans em todo o sistema. Fonte humanista com boa legibilidade em tamanhos pequenos e alto impacto em display." />

      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginBottom: 32 }}>
        <Card>
          <Label>Fonte primária</Label>
          <div style={{ fontSize: 48, fontWeight: 300, color: C.text, lineHeight: 1.1, marginBottom: 8 }}>DM Sans</div>
          <div style={{ fontSize: 13, color: C.textSec, marginBottom: 16 }}>Light · Regular · Medium · Semibold · Bold</div>
          <div style={{ fontSize: 20, fontWeight: 300, color: C.textTer }}>AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz</div>
        </Card>
        <Card>
          <Label>Ícones</Label>
          <div style={{ fontSize: 14, fontWeight: 500, color: C.text, marginBottom: 4 }}>Material Symbols Rounded</div>
          <div style={{ fontSize: 13, color: C.textSec, marginBottom: 16 }}>opsz 20, wght 300, FILL 0/1, GRAD 0</div>
          <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
            {['diversity_3','group','event','bed','payments','check_circle','warning','info'].map(n => (
              <Icon key={n} name={n} size={22} style={{ color: C.textSec }} />
            ))}
          </div>
          <div style={{ marginTop: 10, display: 'flex', gap: 10, alignItems: 'center' }}>
            {['diversity_3','group','event','bed','payments','check_circle','warning','info'].map(n => (
              <Icon key={n} name={n} size={22} fill style={{ color: C.gold }} />
            ))}
          </div>
          <div style={{ marginTop: 8, fontSize: 11, color: C.textTer }}>Outline (wght 300) e Fill (FILL 1)</div>
        </Card>
      </div>

      <Card style={{ padding: 0, overflow: 'hidden' }}>
        <table style={{ width: '100%', borderCollapse: 'collapse' }}>
          <thead>
            <tr style={{ background: C.surfaceRaised }}>
              {['Estilo','Tamanho','Peso','Line-height','Letter-spacing','Uso'].map(h => (
                <th key={h} style={{ padding: '10px 16px', fontSize: 11, fontWeight: 500, color: C.textTer, textAlign: 'left', borderBottom: `1px solid ${C.border}`, letterSpacing: '0.05em', textTransform: 'uppercase' }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {scale.map((s, i) => (
              <tr key={s.name} style={{ borderBottom: i < scale.length - 1 ? `1px solid ${C.border}` : 'none' }}>
                <td style={{ padding: '10px 16px' }}>
                  <span style={{ fontSize: s.size > 22 ? 22 : s.size, fontWeight: s.weight, letterSpacing: s.ls, color: C.text }}>{s.name}</span>
                </td>
                <td style={{ padding: '10px 16px' }}><code style={{ fontSize: 12, background: '#F0EDE8', padding: '2px 6px', borderRadius: 4 }}>{s.size}px</code></td>
                <td style={{ padding: '10px 16px' }}><code style={{ fontSize: 12, background: '#F0EDE8', padding: '2px 6px', borderRadius: 4 }}>{s.weight}</code></td>
                <td style={{ padding: '10px 16px', fontSize: 12, color: C.textSec }}>{s.lh}</td>
                <td style={{ padding: '10px 16px', fontSize: 12, color: C.textSec }}>{s.ls}</td>
                <td style={{ padding: '10px 16px', fontSize: 12, color: C.textTer }}>{s.use}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </Card>

      <div style={{ marginTop: 24, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
        <Card>
          <Label>Exemplo — display light + itálico</Label>
          <div style={{ fontSize: 36, fontWeight: 300, color: C.text, lineHeight: 1.15, letterSpacing: '-0.03em' }}>
            Gestão que libera<br/>
            <em style={{ fontStyle: 'italic', fontWeight: 400 }}>para o essencial.</em>
          </div>
        </Card>
        <Card>
          <Label>Hierarquia padrão em card</Label>
          <p style={{ fontSize: 11, fontWeight: 600, color: C.gold, letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 6 }}>Evento em andamento</p>
          <h2 style={{ fontSize: 22, fontWeight: 600, color: C.text, letterSpacing: '-0.02em', marginBottom: 4 }}>Retiro Koinonia 2025</h2>
          <p style={{ fontSize: 13, color: C.textSec }}>Chácara Paz e Amor · Juiz de Fora, MG</p>
          <div style={{ marginTop: 12, fontSize: 14, color: C.text, lineHeight: 1.65 }}>
            Organize inscrições, acomodações e finanças — sua atenção fica onde importa.
          </div>
        </Card>
      </div>
    </section>
  );
}

/* ── COLOR ──────────────────────────────────────────────────── */
function ColorSection() {
  return (
    <section>
      <SectionH id="color" title="Color"
        sub="Paleta quente baseada em tons terrosos e creme, com dourado como cor de destaque e semânticas de status claras." />

      <Label>Superfícies & fundos</Label>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 14, marginBottom: 32 }}>
        <Swatch hex="#F7F4EF" name="Background" token="bg" size="lg" />
        <Swatch hex="#FFFFFF" name="Surface" token="surface" size="lg" />
        <Swatch hex="#FDFCFA" name="Surface Raised" token="surfaceRaised" size="lg" />
        <Swatch hex="#E8E3D9" name="Border" token="border" size="lg" />
        <Swatch hex="#CFC8BB" name="Border Strong" token="borderStrong" size="lg" />
      </div>

      <Label>Texto</Label>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 14, marginBottom: 32 }}>
        <Swatch hex="#1A1612" name="Text Primary" token="text" size="lg" />
        <Swatch hex="#7A7060" name="Text Secondary" token="textSec" size="lg" />
        <Swatch hex="#B0A898" name="Text Tertiary" token="textTer" size="lg" />
      </div>

      <Label>Acento — Dourado</Label>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 14, marginBottom: 32 }}>
        <Swatch hex="#C4923A" name="Gold" token="gold" size="lg" />
        <Swatch hex="#EDD8AD" name="Gold Muted" token="goldMuted" size="lg" />
        <Swatch hex="#F5ECD9" name="Gold Light" token="goldLight" size="lg" />
      </div>

      <Label>Semânticas de status</Label>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 14, marginBottom: 32 }}>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          <Swatch hex="#3D7A52" name="Success" token="success" />
          <Swatch hex="#E8F4ED" name="Success Light" token="successLight" size="sm" />
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          <Swatch hex="#B07030" name="Warning" token="warning" />
          <Swatch hex="#FBF0E2" name="Warning Light" token="warningLight" size="sm" />
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          <Swatch hex="#9B3A2E" name="Danger" token="danger" />
          <Swatch hex="#FBECEC" name="Danger Light" token="dangerLight" size="sm" />
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          <Swatch hex="#2E628B" name="Info" token="info" />
          <Swatch hex="#E8F2FA" name="Info Light" token="infoLight" size="sm" />
        </div>
      </div>

      <Card>
        <Label>Uso de cor contextual — Gênero de participantes</Label>
        <div style={{ display: 'flex', gap: 16 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <div style={{ width: 36, height: 36, borderRadius: '50%', background: C.goldLight, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <span style={{ fontSize: 14, fontWeight: 700, color: C.gold }}>A</span>
            </div>
            <div>
              <div style={{ fontSize: 13, fontWeight: 500, color: C.text }}>Feminino</div>
              <div style={{ fontSize: 11, color: C.textTer }}>goldLight + gold</div>
            </div>
          </div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <div style={{ width: 36, height: 36, borderRadius: '50%', background: C.infoLight, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>

            <div key={f.rule} style={{ display: 'flex', flexDirection: 'column', padding: '7px 0', borderBottom: `1px solid ${C.border}` }}>
              <span style={{ fontSize: 12, fontWeight: 600, color: C.text }}>{f.rule}</span>
              <span style={{ fontSize: 11, color: C.textSec, marginTop: 2 }}>{f.detail}</span>
            </div>
          ))}
        </Card>
      </div>
    </section>
  );
}

/* ══════════════════════════════════════════════════════════════
   APP ROOT
══════════════════════════════════════════════════════════════ */
function App() {
  const [activeSection, setActiveSection] = React.useState('foundation');

  const scrollTo = (id) => {
    setActiveSection(id);
    const el = document.getElementById(id);
    if (el) {
      const y = el.getBoundingClientRect().top + window.scrollY - 24;
      window.scrollTo({ top: y, behavior: 'smooth' });
    }
  };

  // Update active section on scroll
  React.useEffect(() => {
    const handler = () => {
      for (let i = NAV_SECTIONS.length - 1; i >= 0; i--) {
        const el = document.getElementById(NAV_SECTIONS[i].id);
        if (el && el.getBoundingClientRect().top <= 120) {
          setActiveSection(NAV_SECTIONS[i].id);
          break;
        }
      }
    };
    window.addEventListener('scroll', handler, { passive: true });
    return () => window.removeEventListener('scroll', handler);
  }, []);

  return (
    <div style={{ display: 'flex', minHeight: '100vh', background: C.bg }}>

      {/* Fixed left nav */}
      <nav style={{
        width: 220, flexShrink: 0, position: 'sticky', top: 0, height: '100vh',
        background: C.surface, borderRight: `1px solid ${C.border}`,
        display: 'flex', flexDirection: 'column', overflow: 'hidden',
      }}>
        {/* Logo */}
        <div style={{ padding: '20px 20px 16px', borderBottom: `1px solid ${C.border}` }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 14 }}>
            <div style={{ width: 30, height: 30, borderRadius: 7, background: C.text, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
              <Icon name="diversity_3" size={16} style={{ color: '#fff' }} />
            </div>
            <div>
              <div style={{ fontSize: 14, fontWeight: 700, color: C.text, lineHeight: 1.2 }}>Koinonia</div>
              <div style={{ fontSize: 10, color: C.textTer, letterSpacing: '0.06em', textTransform: 'uppercase' }}>Design System</div>
            </div>
          </div>
          <div style={{ fontSize: 11, color: C.textTer }}>v2 · Abril 2026</div>
        </div>
        {/* Nav */}
        <div style={{ flex: 1, padding: '12px 10px', overflow: 'auto' }}>
          {NAV_SECTIONS.map(s => {
            const active = activeSection === s.id;
            return (
              <button key={s.id} onClick={() => scrollTo(s.id)}
                style={{
                  width: '100%', textAlign: 'left', padding: '8px 10px', borderRadius: 7,
                  fontSize: 13.5, fontWeight: active ? 600 : 400,
                  background: active ? C.goldLight : 'transparent',
                  color: active ? C.gold : C.textSec,
                  border: 'none', cursor: 'pointer', transition: 'all 0.12s',
                  borderLeft: active ? `2px solid ${C.gold}` : '2px solid transparent',
                  marginBottom: 2,
                }}
                onMouseEnter={e => { if (!active) { e.currentTarget.style.background = '#F7F4EF'; e.currentTarget.style.color = C.text; } }}
                onMouseLeave={e => { if (!active) { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = C.textSec; } }}
              >{s.label}</button>
            );
          })}
        </div>
      </nav>

      {/* Main content */}
      <main style={{ flex: 1, padding: '24px 48px 80px', maxWidth: 980, minWidth: 0 }}>
        <FoundationSection />
        <TypographySection />
        <ColorSection />
        <SpacingSection />
        <ComponentsSection />
        <LayoutSection />
        <PatternsSection />
        <ImplementationSection />
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
